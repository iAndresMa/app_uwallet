<div class="horizontal-cards-container" [ngClass]="'tono-' + tono">
  <button
    type="button"
    class="horizontal-card modulo"
    *ngFor="let item of arrayMenu"
    [attr.aria-label]="item.descripcion"
    (click)="servicios(item.nombre, item.descripcion)"
  >
    <span class="modulo__mosaico">
      <img class="modulo__icono" [src]="item.icon" alt="" />
    </span>
    <span class="textoButton">{{ item.descripcion }}</span>
  </button>
</div>
