<ion-header>
  <ion-toolbar color="amarilloW">
    <ion-buttons slot="start" (click)="volver()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-buttons>
    <ion-title>Configuración</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-item-group>
    <ion-item-divider color="azulClaroUW" mode="ios">
      <ion-label>Perfil</ion-label>
    </ion-item-divider>

    <ion-item mode="ios" (click)="openWebPage()">
      <img class="icono-3d" src="/assets/icon/3d/foto.svg" alt="" />
      <ion-label>Actualizar Fotografía</ion-label>
      <ion-badge slot="end" mode="ios">subir</ion-badge>
    </ion-item>
    <!-- <ion-item mode="ios">
      <ion-icon name="phone-portrait" color="azulClaroUW"></ion-icon>
      <ion-label>Eliminar dispositivo</ion-label>
    </ion-item> -->

    <ion-item-divider mode="ios" color="azulClaroUW">
      <ion-label>Aplicación</ion-label>
    </ion-item-divider>

    <ion-item mode="ios" class="item-tema">
      <img class="icono-3d" src="/assets/icon/3d/tema.svg" alt="" />
      <ion-select
        label="Tema"
        interface="action-sheet"
        [interfaceOptions]="{ header: 'Tema de la app' }"
        cancelText="Cancelar"
        [value]="tema.modoActual"
        (ionChange)="cambiarTema($event)"
      >
        <ion-select-option *ngFor="let opcion of opcionesTema" [value]="opcion.valor">{{ opcion.texto }}</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item mode="ios" routerLink="/mesa">
      <img class="icono-3d" src="/assets/icon/3d/ayuda.svg" alt="" />
      <ion-label>Ayuda</ion-label>
    </ion-item>

    <ion-item mode="ios" (click)="cerrarSesion()">
      <img class="icono-3d" src="/assets/icon/3d/salir.svg" alt="" />
      <ion-label>Cerrar sesión</ion-label>
    </ion-item>

  </ion-item-group>

</ion-content>
