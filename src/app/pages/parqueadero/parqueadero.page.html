<ion-header class="header-improved">
  <ion-toolbar class="toolbar-custom">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="volver()" class="back-button-custom">
        <div class="button-content">
          <ion-icon name="chevron-back-outline" class="button-icon"></ion-icon>
          <span class="button-text"></span>
        </div>
      </ion-button>
    </ion-buttons>

    <div class="title-container">
      <ion-title class="title-custom">
        <ion-icon name="qr-code-outline" class="title-icon"></ion-icon>
        <span>QR Parking</span>
      </ion-title>
    </div>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="generarQr()" class="reload-button-custom" id="reload-button">
        <ion-icon name="refresh-outline" class="reload-icon"></ion-icon>
        <ion-ripple-effect></ion-ripple-effect>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <div class="progress-bar" *ngIf="cargandoQR">
    <div class="progress-fill"></div>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="improved-content">
  <div class="container-improved">
    <ion-card mode="ios" class="card-improved">
      <div class="card-header-bg"></div>

      <ion-card-content class="card-content-improved">
        <!-- Estado de carga -->
        <div class="loading-state" *ngIf="cargandoQR">
          <div class="qr-loader">
            <div class="pulse-container">
              <div class="pulse-circle"></div>
              <div class="pulse-circle"></div>
              <div class="pulse-circle"></div>
            </div>
          </div>
          <div class="loading-text">
            <h3>Generando tu código QR</h3>
            <p>{{ mensajeLento }}</p>
          </div>
        </div>

        <!-- Estado de error -->
        <div class="error-state" *ngIf="!cargandoQR && qrError">
          <div class="qr-container">
            <app-error-qr [reloadFunction]="generarQr.bind(this)"></app-error-qr>
          </div>
        </div>

        <!-- QR generado correctamente -->
        <div class="success-state" *ngIf="!cargandoQR && !qrError">
          <div class="qr-container">
            <br/><br/>
            <div class="qr-frame">
              <img alt="Código QR de acceso" id="codigo" class="qr-image" [src]="qr"/>
            </div>
            <div class="qr-refresh-hint">
              <ion-icon name="refresh-circle-outline"></ion-icon>
              <span>Toca el botón de actualizar para regenerar</span>
            </div>
          </div>

          <div class="user-info">
            <h3 class="user-name">{{nombre}} <span class="lastname">{{apellido}}</span></h3>
            <div class="user-details">
              <div class="detail-item">
                <ion-icon name="id-card-outline" class="detail-icon"></ion-icon>
                <span class="detail-text">{{identificacion}}</span>
              </div>
            </div>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
